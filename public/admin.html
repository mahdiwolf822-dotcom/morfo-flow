<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>پنل مدیریت — Morfo Flow</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0C10">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
@font-face{
  font-family:'Vazirmatn';
  src:url('assets/fonts/Vazirmatn-Regular.woff2') format('woff2');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Vazirmatn';
  src:url('assets/fonts/Vazirmatn-Medium.woff2') format('woff2');
  font-weight:500; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Vazirmatn';
  src:url('assets/fonts/Vazirmatn-SemiBold.woff2') format('woff2');
  font-weight:600; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Vazirmatn';
  src:url('assets/fonts/Vazirmatn-Bold.woff2') format('woff2');
  font-weight:700; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Vazirmatn';
  src:url('assets/fonts/Vazirmatn-ExtraBold.woff2') format('woff2');
  font-weight:800; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Vazirmatn';
  src:url('assets/fonts/Vazirmatn-Black.woff2') format('woff2');
  font-weight:900; font-style:normal; font-display:swap;
}
:root{
  --bg:#0A0C10; --bg-soft:#0D1015; --surface:#12161D; --surface-hi:#171B23;
  --line:#212630; --text:#EDEFF3; --muted:#8B93A3; --muted-dim:#5C6473;
  --accent:#22B8A0; --accent-soft:rgba(34,184,160,.14); --accent-line:rgba(34,184,160,.35);
  --danger:#E05A5A; --danger-soft:rgba(224,90,90,.12);
  --radius-s:10px; --radius-m:16px; --maxw:1240px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
  line-height:1.6; min-height:100vh; -webkit-font-smoothing:antialiased;
}
a{color:inherit;} button{font-family:inherit; cursor:pointer;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}
@media (max-width:640px){ .wrap{padding:0 18px;} }
a:focus-visible, button:focus-visible, input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;
}

/* ---------- Login screen ---------- */
#loginScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.login-card{
  width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-m); padding:36px 30px;
}
.login-card .mark{display:flex; align-items:center; gap:10px; margin-bottom:26px; font-weight:700; font-size:18px;}
.login-card h1{font-size:20px; font-weight:800; margin-bottom:8px;}
.login-card p{color:var(--muted); font-size:14px; margin-bottom:24px;}
.login-card input{
  width:100%; background:var(--bg-soft); border:1px solid var(--line); border-radius:10px;
  padding:13px 14px; color:var(--text); font-family:inherit; font-size:15px; margin-bottom:16px;
}
.login-card input:focus{outline:none; border-color:var(--accent-line);}
.btn-primary{
  width:100%; padding:13px; border-radius:10px; border:none;
  background:var(--accent); color:#06231D; font-weight:700; font-size:15px;
}
.login-error{color:var(--danger); font-size:13.5px; margin-top:12px; min-height:18px;}

/* ---------- App shell ---------- */
#app{display:none; min-height:100vh;}
header.topbar{
  border-bottom:1px solid var(--line); background:rgba(10,12,16,.9); backdrop-filter:blur(10px);
  position:sticky; top:0; z-index:10;
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; height:66px;}
.mark{display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px;}
.mark svg{width:26px; height:26px;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.btn-ghost{
  padding:9px 16px; border-radius:9px; border:1px solid var(--line); background:none; color:var(--muted);
  font-size:13.5px; font-weight:600;
}
.btn-ghost:hover{color:var(--text); border-color:var(--accent-line);}

main{padding:40px 0 80px;}

.stats-row{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:36px;}
@media (max-width:700px){ .stats-row{grid-template-columns:1fr;} }
.stat-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:22px 24px;
}
.stat-card .num{font-size:30px; font-weight:800;}
.stat-card .label{color:var(--muted); font-size:13.5px; margin-top:4px;}

.toolbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.toolbar h2{font-size:18px; font-weight:700;}
.search-box input{
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px;
  color:var(--text); font-family:inherit; font-size:14px; width:240px;
}

.lead-list{display:flex; flex-direction:column; gap:12px;}
.lead-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:20px 22px; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:start;
}
.lead-main h3{font-size:16px; font-weight:700; margin-bottom:4px;}
.lead-main .meta{color:var(--muted-dim); font-size:13px; margin-bottom:10px;}
.lead-main .desc{color:var(--muted); font-size:14.5px; max-width:70ch;}
.lead-tags{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.tag{
  font-size:12.5px; padding:4px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent);
  font-weight:600;
}
.lead-side{display:flex; flex-direction:column; align-items:flex-end; gap:10px; white-space:nowrap;}
.status-select{
  background:var(--bg-soft); color:var(--text); border:1px solid var(--line); border-radius:8px;
  padding:7px 10px; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
}
.status-select:focus{ outline:none; border-color:var(--accent-line); }
.status-select.pending{ color:#E0B23A; }
.status-select.in-progress{ color:#3E8CF0; }
.status-select.done{ color:var(--accent); }
.lead-time{color:var(--muted-dim); font-size:12.5px;}
.copy-btn{
  padding:7px 13px; border-radius:8px; border:1px solid var(--line); background:none; color:var(--muted);
  font-size:12.5px; font-weight:600;
}
.copy-btn:hover{color:var(--text); border-color:var(--accent-line);}

.empty-state{
  text-align:center; padding:70px 20px; color:var(--muted); border:1px dashed var(--line); border-radius:var(--radius-m);
}
.empty-state h3{color:var(--text); font-size:17px; margin-bottom:8px;}

.loading{text-align:center; padding:60px 0; color:var(--muted); font-size:14px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="mark">
      <svg viewBox="0 0 32 32" fill="none" width="26" height="26">
        <rect x="1" y="1" width="30" height="30" rx="9" stroke="#22B8A0" stroke-width="1.6"/>
        <path d="M9 20 L14 12 L18 17 L23 9" stroke="#22B8A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Morfo Flow</span>
    </div>
    <h1>ورود به پنل مدیریت</h1>
    <p>توکن مدیریتی که در تنظیمات Cloudflare ثبت کردید را وارد کنید.</p>
    <input type="password" id="tokenInput" placeholder="Admin Token" autocomplete="off">
    <button class="btn-primary" id="loginBtn">ورود</button>
    <p class="login-error" id="loginError" role="alert" aria-live="assertive"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="topbar">
    <div class="wrap topbar-row">
      <div class="mark">
        <svg viewBox="0 0 32 32" fill="none" width="24" height="24">
          <rect x="1" y="1" width="30" height="30" rx="9" stroke="#22B8A0" stroke-width="1.6"/>
          <path d="M9 20 L14 12 L18 17 L23 9" stroke="#22B8A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>پنل مدیریت Morfo Flow</span>
      </div>
      <div class="topbar-right">
        <button class="btn-ghost" id="refreshBtn">به‌روزرسانی</button>
        <button class="btn-ghost" id="logoutBtn">خروج</button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="stats-row">
        <div class="stat-card"><div class="num" id="statTotal">—</div><div class="label">مجموع درخواست‌ها</div></div>
        <div class="stat-card"><div class="num" id="statToday">—</div><div class="label">درخواست‌های امروز</div></div>
        <div class="stat-card"><div class="num" id="statWeek">—</div><div class="label">درخواست‌های هفت روز اخیر</div></div>
      </div>

      <div class="toolbar">
        <h2>درخواست‌های مشتریان</h2>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="جستجو بر اساس نام یا کسب‌وکار...">
        </div>
      </div>

      <div id="listContainer">
        <div class="loading">در حال بارگذاری...</div>
      </div>
    </div>
  </main>
</div>

<script>
const TOKEN_KEY = 'morfo_admin_token';
let allLeads = [];

const loginScreen = document.getElementById('loginScreen');
const app = document.getElementById('app');
const tokenInput = document.getElementById('tokenInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');

function getToken(){ return sessionStorage.getItem(TOKEN_KEY); }
function setToken(t){ sessionStorage.setItem(TOKEN_KEY, t); }
function clearToken(){ sessionStorage.removeItem(TOKEN_KEY); }

async function tryLoad(token){
  const res = await fetch('/api/leads?token=' + encodeURIComponent(token));
  if (!res.ok) throw new Error('unauthorized');
  return res.json();
}

async function boot(){
  const token = getToken();
  if (!token){ showLogin(); return; }
  try{
    const data = await tryLoad(token);
    showApp(data);
  }catch(err){
    clearToken();
    showLogin('نشست منقضی شده، دوباره وارد شوید.');
  }
}

function showLogin(msg){
  loginScreen.style.display = 'flex';
  app.style.display = 'none';
  if (msg) loginError.textContent = msg;
}

function showApp(data){
  loginScreen.style.display = 'none';
  app.style.display = 'block';
  allLeads = data.leads || [];
  renderStats(allLeads);
  renderList(allLeads);
}

loginBtn.addEventListener('click', async () => {
  const token = tokenInput.value.trim();
  if (!token) return;
  loginError.textContent = '';
  loginBtn.disabled = true;
  try{
    const data = await tryLoad(token);
    setToken(token);
    showApp(data);
  }catch(err){
    loginError.textContent = 'توکن نادرست است.';
  }finally{
    loginBtn.disabled = false;
  }
});
tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });

document.getElementById('logoutBtn').addEventListener('click', () => {
  clearToken();
  showLogin();
  tokenInput.value = '';
});

document.getElementById('refreshBtn').addEventListener('click', boot);

document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const filtered = !q ? allLeads : allLeads.filter(l =>
    (l.name || '').toLowerCase().includes(q) || (l.business || '').toLowerCase().includes(q)
  );
  renderList(filtered);
});

function renderStats(leads){
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const weekAgo = new Date(now.getTime() - 7*24*60*60*1000);

  document.getElementById('statTotal').textContent = leads.length;
  document.getElementById('statToday').textContent = leads.filter(l => new Date(l.createdAt) >= startOfToday).length;
  document.getElementById('statWeek').textContent = leads.filter(l => new Date(l.createdAt) >= weekAgo).length;
}

function renderList(leads){
  const container = document.getElementById('listContainer');
  if (!leads.length){
    container.innerHTML = '<div class="empty-state"><h3>هنوز درخواستی ثبت نشده</h3><p>وقتی کسی فرم سایت را پر کند، اینجا نمایش داده می‌شود.</p></div>';
    return;
  }
  container.innerHTML = '<div class="lead-list">' + leads.map(leadCard).join('') + '</div>';
}

function leadCard(l){
  const time = formatTime(l.createdAt);
  const contact = l.phone || l.email || '—';
  const sourceLabel = l.source === 'dashboard' ? 'حساب کاربری' : 'فرم سایت';
  const statusClass = l.status === 'تکمیل‌شده' ? 'done' : (l.status === 'در حال انجام' ? 'in-progress' : 'pending');
  const statuses = ['در انتظار بررسی', 'در حال انجام', 'تکمیل‌شده'];
  return `
    <div class="lead-card" data-id="${escapeAttr(l.id)}">
      <div class="lead-main">
        <h3>${escapeHtml(l.name || 'بدون نام')} — ${escapeHtml(l.business)}</h3>
        <div class="meta">${escapeHtml(contact)}</div>
        <div class="desc">${escapeHtml(l.description)}</div>
        <div class="lead-tags">
          ${l.type ? `<span class="tag">${escapeHtml(l.type)}</span>` : ''}
          <span class="tag" style="background:var(--bg-soft); color:var(--muted);">${sourceLabel}</span>
        </div>
      </div>
      <div class="lead-side">
        <span class="lead-time">${time}</span>
        <select class="status-select ${statusClass}" onchange="updateStatus('${escapeAttr(l.id)}', this)">
          ${statuses.map(s => `<option value="${s}" ${s === l.status ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${escapeAttr(contact)}')">کپی اطلاعات تماس</button>
      </div>
    </div>
  `;
}

async function updateStatus(id, selectEl){
  const newStatus = selectEl.value;
  const prevClass = selectEl.className;
  selectEl.disabled = true;
  try{
    const res = await fetch('/api/leads/' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Token': getToken() },
      body: JSON.stringify({ status: newStatus }),
    });
    if (!res.ok) throw new Error('failed');
    const lead = allLeads.find(l => l.id === id);
    if (lead) lead.status = newStatus;
    selectEl.className = 'status-select ' + (newStatus === 'تکمیل‌شده' ? 'done' : (newStatus === 'در حال انجام' ? 'in-progress' : 'pending'));
  }catch(err){
    selectEl.className = prevClass;
    alert('به‌روزرسانی وضعیت با مشکل مواجه شد. دوباره تلاش کنید.');
  }finally{
    selectEl.disabled = false;
  }
}

function formatTime(iso){
  try{
    return new Date(iso).toLocaleString('fa-IR', { dateStyle:'medium', timeStyle:'short' });
  }catch(e){ return iso; }
}
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return String(s || '').replace(/'/g, "\\'"); }

boot();
</script>
</body>
</html>
