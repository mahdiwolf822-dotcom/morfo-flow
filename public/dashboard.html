<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>داشبورد | Morfo Flow</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0C10">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
@font-face{
  font-family:'Vazirmatn';
  src:url('assets/fonts/Vazirmatn-Regular.woff2') format('woff2');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Vazirmatn';
  src:url('assets/fonts/Vazirmatn-Medium.woff2') format('woff2');
  font-weight:500; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Vazirmatn';
  src:url('assets/fonts/Vazirmatn-SemiBold.woff2') format('woff2');
  font-weight:600; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Vazirmatn';
  src:url('assets/fonts/Vazirmatn-Bold.woff2') format('woff2');
  font-weight:700; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Vazirmatn';
  src:url('assets/fonts/Vazirmatn-ExtraBold.woff2') format('woff2');
  font-weight:800; font-style:normal; font-display:swap;
}
:root{
  --bg:#0A0C10; --bg-soft:#0D1015; --surface:#12161D; --surface-hi:#171B23;
  --line:#212630; --text:#EDEFF3; --muted:#8B93A3; --muted-dim:#5C6473;
  --accent:#22B8A0; --accent-soft:rgba(34,184,160,.14); --accent-line:rgba(34,184,160,.35);
  --warn:#E0B23A; --warn-soft:rgba(224,178,58,.14);
  --ok:#22B8A0; --ok-soft:rgba(34,184,160,.14);
  --radius-s:10px; --radius-m:16px; --maxw:960px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
  line-height:1.65; min-height:100vh; -webkit-font-smoothing:antialiased;
}
a{color:inherit;} button{font-family:inherit; cursor:pointer;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
@media (max-width:640px){ .wrap{padding:0 18px;} }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;
}

header.topbar{
  border-bottom:1px solid var(--line); background:rgba(10,12,16,.9); backdrop-filter:blur(10px);
  position:sticky; top:0; z-index:10;
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; height:68px;}
.mark{display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px;}
.mark svg{width:24px; height:24px;}
.user-chip{display:flex; align-items:center; gap:10px;}
.avatar{
  width:32px; height:32px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; overflow:hidden;
}
.avatar img{width:100%; height:100%; object-fit:cover;}
.user-name{font-size:14px; font-weight:600;}
.btn-ghost{
  padding:9px 16px; border-radius:9px; border:1px solid var(--line); background:none; color:var(--muted);
  font-size:13.5px; font-weight:600; margin-inline-start:14px;
}
.btn-ghost:hover{color:var(--text); border-color:var(--accent-line);}

main{padding:44px 0 80px;}
.welcome h1{font-size:24px; font-weight:800; margin-bottom:6px;}
.welcome p{color:var(--muted); font-size:14.5px; margin-bottom:36px;}

.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:28px; margin-bottom:28px;
}
.panel h2{font-size:17px; font-weight:700; margin-bottom:18px;}

.field{margin-bottom:16px;}
.field label{display:block; font-size:13.5px; color:var(--muted); margin-bottom:7px; font-weight:600;}
.field input, .field textarea{
  width:100%; background:var(--bg-soft); border:1px solid var(--line); border-radius:10px;
  padding:12px 14px; color:var(--text); font-family:inherit; font-size:14.5px;
}
.field input:focus, .field textarea:focus{outline:none; border-color:var(--accent-line);}
.field textarea{resize:vertical;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:560px){ .form-row{grid-template-columns:1fr;} }

.btn-primary{
  padding:12px 22px; border-radius:10px; border:none;
  background:var(--accent); color:#06231D; font-weight:700; font-size:14.5px;
  transition:transform .16s, box-shadow .16s;
}
.btn-primary:hover{ transform:translateY(-1px); box-shadow:0 10px 22px -10px var(--accent-line); }
.btn-primary:disabled{ opacity:.6; pointer-events:none; }

.form-msg{margin-top:12px; font-size:13.5px; min-height:18px; color:var(--muted);}
.form-msg.error{color:#E05A5A;}
.form-msg.success{color:var(--accent);}

.req-list{display:flex; flex-direction:column; gap:12px;}
.req-card{
  background:var(--bg-soft); border:1px solid var(--line); border-radius:12px; padding:18px 20px;
  display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;
}
.req-card h3{font-size:15px; font-weight:700; margin-bottom:4px;}
.req-card .meta{color:var(--muted-dim); font-size:12.5px; margin-bottom:8px;}
.req-card p{color:var(--muted); font-size:14px; max-width:60ch;}
.status-badge{
  font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px; white-space:nowrap;
}
.status-badge.pending{ background:var(--warn-soft); color:var(--warn); }
.status-badge.done{ background:var(--ok-soft); color:var(--ok); }

.empty{ text-align:center; padding:36px 20px; color:var(--muted); border:1px dashed var(--line); border-radius:12px; font-size:14px; }
.loading{ text-align:center; padding:30px 0; color:var(--muted); font-size:14px; }

/* ---------- Plan usage banner ---------- */
.plan-banner{
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  background:linear-gradient(135deg, var(--surface), var(--bg-soft)); border:1px solid var(--line);
  border-radius:var(--radius-m); padding:20px 24px; margin-bottom:28px;
}
.plan-banner .info{display:flex; flex-direction:column; gap:8px;}
.plan-badge{
  display:inline-flex; width:fit-content; font-size:12px; font-weight:800; padding:4px 11px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent);
}
.plan-badge.pro{ background:rgba(62,140,240,.16); color:#3E8CF0; }
.usage-bars{display:flex; gap:22px; flex-wrap:wrap;}
.usage-item{display:flex; flex-direction:column; gap:5px; min-width:140px;}
.usage-item .label{font-size:12px; color:var(--muted);}
.usage-track{width:100%; height:6px; border-radius:99px; background:var(--bg-soft); overflow:hidden;}
.usage-fill{height:100%; background:var(--accent); border-radius:99px; transition:width .3s;}
.usage-fill.full{ background:#E0B23A; }
.btn-upgrade{
  padding:10px 20px; border-radius:10px; border:1px solid var(--accent-line); background:var(--accent-soft);
  color:var(--accent); font-weight:700; font-size:13.5px; white-space:nowrap;
}
.btn-upgrade:hover{ background:var(--accent); color:#06231D; }

/* ---------- Automation cards ---------- */
.automation-card{
  background:var(--bg-soft); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:16px;
}
.automation-head{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
.automation-title{display:flex; align-items:center; gap:10px;}
.automation-title h3{font-size:15.5px; font-weight:700;}
.bot-handle{color:var(--accent); font-size:13px; font-weight:600; direction:ltr; display:inline-block;}
.status-dot{width:8px; height:8px; border-radius:50%; background:var(--accent); display:inline-block;}
.btn-danger-ghost{
  padding:7px 13px; border-radius:8px; border:1px solid var(--line); background:none; color:var(--muted); font-size:12.5px; font-weight:600;
}
.btn-danger-ghost:hover{ color:#E05A5A; border-color:#E05A5A; }

.rule-row{
  display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line);
}
.rule-row:first-of-type{ border-top:none; }
.rule-kw{ font-size:13.5px; font-weight:700; background:var(--surface); padding:5px 11px; border-radius:8px; white-space:nowrap; }
.rule-arrow{ color:var(--muted-dim); }
.rule-reply{ flex:1; font-size:13.5px; color:var(--muted); }
.rule-del{ color:var(--muted-dim); background:none; border:none; padding:4px; }
.rule-del:hover{ color:#E05A5A; }

.add-rule-row{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.add-rule-row input{
  background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:9px 12px;
  color:var(--text); font-family:inherit; font-size:13.5px;
}
.add-rule-row input.kw{ width:140px; }
.add-rule-row input.reply{ flex:1; min-width:180px; }
.btn-small{
  padding:9px 16px; border-radius:9px; border:none; background:var(--accent); color:#06231D; font-weight:700; font-size:13px;
}
.btn-small:disabled{ opacity:.5; pointer-events:none; }

.limit-note{ font-size:12.5px; color:var(--warn); margin-top:10px; }

/* ---------- AI config / stats / live test (advanced section) ---------- */
.adv-toggle{
  background:none; border:none; color:var(--muted); font-size:12.5px; font-weight:600; padding:10px 0 0;
  display:flex; align-items:center; gap:5px;
}
.adv-toggle:hover{ color:var(--text); }
.adv-toggle svg{ width:13px; height:13px; transition:transform .2s; }
.adv-toggle.open svg{ transform:rotate(180deg); }
.adv-section{ display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.adv-section.open{ display:block; }

.stats-line{
  display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-bottom:16px;
}
.stats-line b{ color:var(--text); }

.ai-box{ background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:16px; margin-bottom:16px; }
.ai-status-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; }
.ai-status-row .label{ font-size:13.5px; font-weight:700; }
.ai-pill{ font-size:11.5px; font-weight:800; padding:3px 10px; border-radius:999px; white-space:nowrap; }
.ai-pill.on{ background:var(--accent-soft); color:var(--accent); }
.ai-pill.off{ background:var(--bg-soft); color:var(--muted-dim); }
.ai-desc{ color:var(--muted); font-size:12.5px; margin-bottom:14px; }

.provider-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px; }
.provider-chip{
  position:relative; display:flex; align-items:center; gap:7px; padding:8px 12px 8px 26px;
  border-radius:10px; border:1px solid var(--line); background:var(--bg-soft); color:var(--muted);
  font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; transition:all .15s;
}
.provider-chip:hover{ border-color:var(--accent-line); color:var(--text); }
.provider-chip.connected{ border-color:var(--muted-dim); color:var(--text); }
.provider-chip.active{
  background:var(--accent-soft); border-color:var(--accent); color:var(--accent);
}
.chip-dot{ width:7px; height:7px; border-radius:50%; background:var(--muted-dim); flex:0 0 auto; }
.provider-chip.connected .chip-dot{ background:var(--muted); }
.provider-chip.active .chip-dot{ background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.chip-remove{
  position:absolute; left:6px; top:50%; transform:translateY(-50%); width:16px; height:16px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; color:var(--muted-dim); font-size:12px; line-height:1;
}
.chip-remove:hover{ background:rgba(224,90,90,.18); color:#E05A5A; }

.ai-connect-form{ display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.ai-connect-form.open{ display:block; }
.ai-connect-form input{
  width:100%; background:var(--bg-soft); border:1px solid var(--line); border-radius:9px; padding:10px 12px;
  color:var(--text); font-family:inherit; font-size:13px; margin-bottom:8px; direction:ltr; text-align:left;
}
.ai-connect-form small{ display:block; color:var(--muted-dim); font-size:11.5px; margin-bottom:10px; }
.ai-connect-form small a{ color:var(--accent); }

.fallback-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line);
}
.fallback-row .fb-text{ font-size:12.5px; }
.fallback-row .fb-text b{ display:block; font-size:13px; margin-bottom:2px; }
.switch{ position:relative; display:inline-block; width:42px; height:24px; flex:0 0 auto; }
.switch input{ opacity:0; width:0; height:0; }
.switch .slider{
  position:absolute; inset:0; background:var(--bg-soft); border:1px solid var(--line); border-radius:999px; cursor:pointer; transition:.2s;
}
.switch .slider::before{
  content:''; position:absolute; width:16px; height:16px; right:3px; top:3px; background:var(--muted); border-radius:50%; transition:.2s;
}
.switch input:checked + .slider{ background:var(--accent-soft); border-color:var(--accent-line); }
.switch input:checked + .slider::before{ background:var(--accent); transform:translateX(-18px); }

.ai-instructions-row{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.ai-instructions-row label{ display:block; font-size:12px; color:var(--muted); margin-bottom:7px; font-weight:600; }
.ai-instructions-row textarea{
  width:100%; background:var(--bg-soft); border:1px solid var(--line); border-radius:9px; padding:10px 12px;
  color:var(--text); font-family:inherit; font-size:13px; margin-bottom:8px; resize:vertical;
}
.ai-msg{ font-size:12.5px; margin-top:8px; min-height:16px; }
.ai-msg.error{ color:#E05A5A; }
.ai-msg.success{ color:var(--accent); }

.test-box{ background:var(--bg-soft); border:1px solid var(--line); border-radius:11px; padding:14px; }
.test-msgs{ max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:10px; min-height:40px; }
.test-msg{ max-width:85%; padding:8px 12px; border-radius:10px; font-size:12.5px; line-height:1.6; }
.test-msg.user{ background:var(--accent); color:#06231D; align-self:flex-end; }
.test-msg.bot{ background:var(--surface); color:var(--text); align-self:flex-start; }
.test-msg.bot.empty-note{ color:var(--muted-dim); font-style:italic; }
.test-input-row{ display:flex; gap:8px; }
.test-input-row input{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:9px 12px; color:var(--text); font-family:inherit; font-size:13px; }

.connect-card{
  border:1.5px dashed var(--line); border-radius:var(--radius-m); padding:32px; text-align:center; margin-bottom:28px;
}
.connect-card h3{font-size:17px; font-weight:700; margin-bottom:8px;}
.connect-card p{color:var(--muted); font-size:14px; max-width:48ch; margin:0 auto 22px;}
.connect-steps{ text-align:right; max-width:420px; margin:0 auto 24px; }
.connect-steps li{ color:var(--muted); font-size:13.5px; margin-bottom:8px; padding-inline-start:6px; }
.connect-form{ max-width:420px; margin:0 auto; text-align:right; }

.channel-tabs{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:22px; }
.channel-tab{
  padding:8px 14px; border-radius:9px; border:1px solid var(--line); background:var(--bg-soft);
  color:var(--muted); font-size:12.5px; font-weight:600; font-family:inherit;
}
.channel-tab.active{ background:var(--accent); color:#06231D; border-color:var(--accent); }
.channel-tab.disabled{ opacity:.45; cursor:not-allowed; }
.channel-panel .connect-steps, .channel-panel .field{ max-width:420px; margin-left:auto; margin-right:auto; }

.embed-box{
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:16px;
}
.embed-code{
  display:block; direction:ltr; text-align:left; word-break:break-all; background:var(--bg-soft);
  padding:10px 12px; border-radius:8px; font-size:12px; color:var(--accent); font-family:monospace;
}

#authGate{ display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--muted); font-size:14px; }
#appShell{ display:none; }
</style>
</head>
<body>

<div id="authGate">در حال بررسی ورود شما...</div>

<div id="appShell">
  <header class="topbar">
    <div class="wrap topbar-row">
      <div class="mark">
        <svg viewBox="0 0 32 32" fill="none"><rect x="1" y="1" width="30" height="30" rx="9" stroke="#22B8A0" stroke-width="1.6"/><path d="M9 20 L14 12 L18 17 L23 9" stroke="#22B8A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Morfo Flow</span>
      </div>
      <div class="user-chip">
        <div class="avatar" id="avatar"></div>
        <span class="user-name" id="userName"></span>
        <button class="btn-ghost" id="logoutBtn">خروج</button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="welcome">
        <h1>سلام، <span id="welcomeName"></span> 👋</h1>
        <p>ربات تلگرام کسب‌وکارت رو وصل کن و بذار خودش جواب مشتری‌ها رو بده.</p>
      </div>

      <div class="plan-banner">
        <div class="info">
          <span class="plan-badge" id="planBadge">پلن رایگان</span>
          <div class="usage-bars" id="usageBars"></div>
        </div>
        <button class="btn-upgrade" id="upgradeBtn">ارتقا به حرفه‌ای</button>
      </div>

      <div id="automationsContainer"><div class="loading">در حال بارگذاری...</div></div>

      <div class="panel">
        <h2>نیاز به یه چیز خاص‌تری داری؟</h2>
        <p style="color:var(--muted); font-size:13.5px; margin-bottom:18px;">اگه اتوماسیونی می‌خوای که فراتر از پاسخ خودکار تلگرامه (مثل اتصال به فروشگاه یا حسابداری)، برامون توضیح بده.</p>
        <form id="reqForm">
          <div class="form-row">
            <div class="field">
              <label for="r-business">نام کسب‌وکار</label>
              <input id="r-business" required>
            </div>
            <div class="field">
              <label for="r-type">نوع کسب‌وکار</label>
              <input id="r-type" placeholder="اختیاری">
            </div>
          </div>
          <div class="field">
            <label for="r-desc">چه چیزی می‌خوای خودکار بشه؟</label>
            <textarea id="r-desc" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn-primary" id="reqSubmit">ثبت درخواست</button>
          <p class="form-msg" id="reqMsg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>
</div>

<script>
let currentUser = null;
let planLimits = { maxAutomations: 1, maxRulesPerAutomation: 3 };
let userPlan = 'free';
const openAdvIds = new Set(); // کدوم کارت‌ها بخش پیشرفته‌شون باز بوده، تا بعد از reload بسته نشه
const openProviderForm = {}; // automationId -> provider که فرم اتصالش بازه

const PROVIDERS = [
  { id: 'gemini', label: 'Gemini', keyUrl: 'https://aistudio.google.com/apikey' },
  { id: 'openai', label: 'OpenAI', keyUrl: 'https://platform.openai.com/api-keys' },
  { id: 'anthropic', label: 'Claude', keyUrl: 'https://console.anthropic.com/settings/keys' },
  { id: 'groq', label: 'Groq', keyUrl: 'https://console.groq.com/keys' },
  { id: 'openrouter', label: 'OpenRouter', keyUrl: 'https://openrouter.ai/keys' },
  { id: 'deepseek', label: 'DeepSeek', keyUrl: 'https://platform.deepseek.com/api_keys' },
];

async function boot(){
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) throw new Error('unauthorized');
    const data = await res.json();
    currentUser = data.user;
    showApp();
    loadAutomations();
    showOAuthResultBanner();
  } catch (err) {
    window.location.href = '/login.html';
  }
}

// بعد از برگشت از OAuth اینستاگرام، بر اساس ?ig_connected یا ?ig_error یه پیام مناسب نشون بده و URL رو تمیز کن
function showOAuthResultBanner(){
  const params = new URLSearchParams(window.location.search);
  const IG_ERROR_MESSAGES = {
    state: 'اتصال اینستاگرام لغو شد یا منقضی شد. دوباره تلاش کن.',
    limit: 'به سقف کانال‌های پلن رایگانت رسیدی.',
    oauth: 'اتصال به اینستاگرام ناموفق بود. دوباره تلاش کن.',
    no_ig_account: 'پیج فیسبوکت به یک حساب اینستاگرام Business/Creator وصل نیست.',
    server: 'سرور فعلاً آماده اتصال اینستاگرام نیست.',
  };
  if (params.get('ig_connected')){
    alert('حساب اینستاگرام با موفقیت وصل شد! ✅');
  } else if (params.get('ig_error')){

  msg.className = 'form-msg';

/* ---------- Automation engine ---------- */
async function loadAutomations(){
  const container = document.getElementById('automationsContainer');
  try {
    const res = await fetch('/api/automations');
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error();
    userPlan = data.plan;
    planLimits = data.limits;
    renderPlanBanner(data.automations);
    renderAutomations(data.automations);
  } catch (err) {
    container.innerHTML = '<div class="empty">مشکلی در بارگذاری اتوماسیون‌ها پیش آمد.</div>';
  }
}

function renderPlanBanner(automations){
  document.getElementById('planBadge').textContent = userPlan === 'pro' ? 'پلن حرفه‌ای' : 'پلن رایگان';
  document.getElementById('planBadge').className = 'plan-badge' + (userPlan === 'pro' ? ' pro' : '');

  const totalRules = automations.reduce((sum, a) => sum + a.rules.length, 0);
  const maxRulesTotal = planLimits.maxRulesPerAutomation * Math.max(automations.length, 1);
  const botPct = Math.min(100, (automations.length / planLimits.maxAutomations) * 100);

  document.getElementById('usageBars').innerHTML = `
    <div class="usage-item">
      <span class="label">ربات‌ها: ${automations.length} از ${planLimits.maxAutomations}</span>
      <div class="usage-track"><div class="usage-fill ${botPct >= 100 ? 'full' : ''}" style="width:${botPct}%"></div></div>
    </div>
  `;
}

let lastAutomations = [];

function renderAutomations(automations){
  lastAutomations = automations;
  const container = document.getElementById('automationsContainer');

  if (!automations.length){
    container.innerHTML = connectCardHtml();
    bindConnectForm();
    return;
  }

  container.innerHTML = automations.map(automationCardHtml).join('');
  automations.forEach(a => bindAutomationCard(a));

  if (automations.length < planLimits.maxAutomations){
    container.innerHTML += connectCardHtml(true);
    bindConnectForm();
  }
}

  const oldCard = document.querySelector(`.automation-card[data-automation-id="${cssEscape(automationId)}"]`);
  if (!oldCard) return;
  oldCard.outerHTML = automationCardHtml(automation);
  bindAutomationCard(automation);
}

const TOKEN_BASED_CHANNELS = ['telegram', 'bale'];

function bindConnectForm(){
  document.querySelectorAll('.connect-card').forEach(card => {
    let activeChannel = 'telegram';
    const submitBtn = card.querySelector('.connect-submit');

    function syncPanels(){
      card.querySelectorAll('.channel-panel').forEach(p => {
        p.style.display = p.dataset.panel === activeChannel ? 'block' : 'none';
      });
      // اینستاگرام با OAuth کار می‌کنه (یه لینک مستقیمه)، نه فرم — دکمه ارسال رو براش نشون نده
      submitBtn.style.display = activeChannel === 'instagram' ? 'none' : 'block';
    }

    card.querySelectorAll('.channel-tab:not(.disabled)').forEach(tab => {
      tab.addEventListener('click', () => {
        activeChannel = tab.dataset.channel;
        card.querySelectorAll('.channel-tab').forEach(t => t.classList.toggle('active', t === tab));
        syncPanels();
      });
    });
    syncPanels();

    submitBtn.addEventListener('click', async () => {
      const msg = card.querySelector('.connect-msg');
      msg.className = 'form-msg connect-msg';
      msg.textContent = '';

      const activePanel = card.querySelector(`.channel-panel[data-panel="${activeChannel}"]`);
      const name = activePanel.querySelector('.field-name')?.value.trim() || '';
      const isTokenBased = TOKEN_BASED_CHANNELS.includes(activeChannel);
      const botToken = isTokenBased ? (activePanel.querySelector('.field-token')?.value.trim() || '') : '';

      if (!name || (isTokenBased && !botToken)){
        msg.textContent = isTokenBased ? 'نام کسب‌وکار و توکن ربات رو وارد کن.' : 'نام کسب‌وکار رو وارد کن.';
        msg.className = 'form-msg connect-msg error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'در حال اتصال...';
      try {
        const res = await fetch('/api/automations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, channelType: activeChannel, botToken }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok){
          msg.textContent = data.upgradeRequired ? (data.error + ' — برای ارتقا با پشتیبانی در تماس باش.') : (data.error || 'اتصال ناموفق بود.');
          msg.className = 'form-msg connect-msg error';
          return;
        }
        loadAutomations();
      } catch (err) {
        msg.textContent = 'مشکلی پیش اومد. دوباره تلاش کن.';
        msg.className = 'form-msg connect-msg error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'اتصال';
      }
    });
  });
}

function bindAutomationCard(automation){
  const card = document.querySelector(`.automation-card[data-automation-id="${cssEscape(automation.id)}"]`);
  if (!card) return;

  card.querySelector('.delete-automation').addEventListener('click', async () => {
    if (!confirm(`«${automation.name}» حذف بشه؟ دیگه پاسخ خودکار نمی‌ده.`)) return;
    await fetch('/api/automations/' + encodeURIComponent(automation.id), { method: 'DELETE' });
    loadAutomations();
  });

  const copyBtn = card.querySelector('.copy-embed');
  if (copyBtn) {
    copyBtn.addEventListener('click', () => {
      const code = card.querySelector('.embed-code').textContent;
      navigator.clipboard.writeText(code);
      copyBtn.textContent = 'کپی شد ✓';
      setTimeout(() => { copyBtn.textContent = 'کپی کد'; }, 1500);
    });
  }

  // advanced section toggle
  const advToggle = card.querySelector('.adv-toggle');
  const advSection = card.querySelector('.adv-section');
  advToggle.addEventListener('click', () => {
    const nowOpen = advToggle.classList.toggle('open');
    advSection.classList.toggle('open', nowOpen);
    if (nowOpen) openAdvIds.add(automation.id);
    else openAdvIds.delete(automation.id);
  });

  const aiMsg = card.querySelector('.ai-msg');

  // provider chips: click = connect (if new) or switch (if already connected)
  card.querySelectorAll('.provider-chip').forEach(chip => {
    chip.addEventListener('click', async (e) => {
      if (e.target.closest('.chip-remove')) return; // handled separately below
      const providerId = chip.dataset.provider;
      const isConnected = chip.classList.contains('connected');
      const isActive = chip.classList.contains('active');

      if (isConnected && !isActive) {
        // SWITCH: یک کلیک برای فعال کردن ارائه‌دهنده‌ای که قبلاً وصل شده
        aiMsg.textContent = '';
        aiMsg.className = 'ai-msg';
        try {
          const res = await fetch(`/api/automations/${encodeURIComponent(automation.id)}/ai/active`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider: providerId }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) { aiMsg.textContent = data.error || 'سوییچ ناموفق بود.'; aiMsg.className = 'ai-msg error'; return; }
          loadAutomations();
        } catch (err) {
          aiMsg.textContent = 'مشکلی پیش اومد.'; aiMsg.className = 'ai-msg error';
        }
        return;
      }

      if (!isConnected) {
        // باز کردن فرم اتصال برای این ارائه‌دهنده (بقیه فرم‌ها بسته می‌شن)
        openProviderForm[automation.id] = openProviderForm[automation.id] === providerId ? null : providerId;
        rerenderCard(automation.id);
      }
      // اگه روی همون ارائه‌دهنده فعال کلیک شد، کاری لازم نیست
    });
  });

  // × روی هر چیپ وصل‌شده = حذف اون اعتبارنامه
  card.querySelectorAll('.chip-remove').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const providerId = btn.dataset.provider;
      if (!confirm(`اتصال ${providerId} حذف بشه؟`)) return;
      await fetch(`/api/automations/${encodeURIComponent(automation.id)}/ai/credentials`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider: providerId }),
      });
      loadAutomations();
    });
  });

  // ذخیره کلید در فرم اتصال باز
  const keySaveBtn = card.querySelector('.provider-key-save');
  if (keySaveBtn) {
    keySaveBtn.addEventListener('click', async () => {
      const providerId = openProviderForm[automation.id];
      const apiKey = card.querySelector('.provider-key-input').value.trim();
      if (!apiKey) { aiMsg.textContent = 'کلید API رو وارد کن.'; aiMsg.className = 'ai-msg error'; return; }
      keySaveBtn.disabled = true;
      keySaveBtn.textContent = 'در حال بررسی کلید...';
      aiMsg.textContent = ''; aiMsg.className = 'ai-msg';
      try {
        const res = await fetch(`/api/automations/${encodeURIComponent(automation.id)}/ai/credentials`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider: providerId, apiKey }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) { aiMsg.textContent = data.error || 'اتصال ناموفق بود.'; aiMsg.className = 'ai-msg error'; return; }
        openProviderForm[automation.id] = null;
        loadAutomations();
      } catch (err) {
        aiMsg.textContent = 'مشکلی پیش اومد.'; aiMsg.className = 'ai-msg error';
      } finally {
        keySaveBtn.disabled = false;
        keySaveBtn.textContent = 'وصل کردن';
      }
    });
  }

  // سوییچ حالت هوشمند (fallback خودکار)
  const fallbackToggle = card.querySelector('.fallback-toggle');
  if (fallbackToggle) {
    fallbackToggle.addEventListener('change', async () => {
      await fetch(`/api/automations/${encodeURIComponent(automation.id)}/ai/fallback`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled: fallbackToggle.checked }),
      });
    });
  }

  // ذخیره دستورالعمل (مستقل از کلیدها)
  const instrSaveBtn = card.querySelector('.ai-instructions-save');
  if (instrSaveBtn) {
    instrSaveBtn.addEventListener('click', async () => {
      const instructions = card.querySelector('.ai-instructions-input').value.trim();
      instrSaveBtn.disabled = true;
      try {
        const res = await fetch(`/api/automations/${encodeURIComponent(automation.id)}/ai/instructions`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ instructions }),
        });
        const data = await res.json();
        aiMsg.textContent = data.ok ? 'دستورالعمل ذخیره شد.' : (data.error || 'ذخیره ناموفق بود.');
        aiMsg.className = data.ok ? 'ai-msg success' : 'ai-msg error';
      } finally {
        instrSaveBtn.disabled = false;
      }
    });
  }

  // live test box
  const testMsgs = card.querySelector('.test-msgs');
  const testInput = card.querySelector('.test-input');
  const testSendBtn = card.querySelector('.test-send-btn');
  async function sendTestMessage(){
    const text = testInput.value.trim();
    if (!text) return;
    testMsgs.insertAdjacentHTML('beforeend', `<div class="test-msg user">${escapeHtml(text)}</div>`);
    testInput.value = '';
    testMsgs.scrollTop = testMsgs.scrollHeight;
    try {
      const res = await fetch(`/api/automations/${encodeURIComponent(automation.id)}/test`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      const isEmpty = data.ok && data.source === 'none';
      testMsgs.insertAdjacentHTML('beforeend', `<div class="test-msg bot${isEmpty ? ' empty-note' : ''}">${escapeHtml(data.reply || data.error || 'خطا')}</div>`);
    } catch (err) {
      testMsgs.insertAdjacentHTML('beforeend', `<div class="test-msg bot">اتصال برقرار نشد.</div>`);
    }
    testMsgs.scrollTop = testMsgs.scrollHeight;
  }
  if (testSendBtn) {
    testSendBtn.addEventListener('click', sendTestMessage);
    testInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendTestMessage(); });
  }

  card.querySelectorAll('.rule-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      const ruleId = btn.closest('.rule-row').dataset.ruleId;
      await fetch(`/api/automations/${encodeURIComponent(automation.id)}/rules/${encodeURIComponent(ruleId)}`, { method: 'DELETE' });
      loadAutomations();
    });
  });

  const addBtn = card.querySelector('.add-rule-btn');
  addBtn.addEventListener('click', async () => {
    const keyword = card.querySelector('.new-kw').value.trim();
    const reply = card.querySelector('.new-reply').value.trim();
    if (!keyword || !reply) return;
    addBtn.disabled = true;
    try {
      const res = await fetch(`/api/automations/${encodeURIComponent(automation.id)}/rules`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keyword, reply }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok){
        alert(data.error || 'افزودن قانون ناموفق بود.');
        return;
      }
      loadAutomations();
    } finally {
      addBtn.disabled = false;
    }
  });
}

function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return String(s || '').replace(/"/g, '&quot;'); }
function cssEscape(s){ return String(s).replace(/(["\\])/g, '\\$1'); }

boot();
</script>
</body>
</html>
